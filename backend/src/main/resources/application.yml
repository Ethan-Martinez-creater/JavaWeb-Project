spring:
  application:
    name: eventflow
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/eventflow?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  orders:
    expiry-scan-enabled: ${ORDER_EXPIRY_SCAN_ENABLED:true}
    expiry-scan-delay-ms: 30000
  jwt:
    secret: ${JWT_SECRET}
    issuer: eventflow
    ttl-seconds: 3600
